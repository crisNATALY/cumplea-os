<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0f5">
  <title>¡Feliz cumpleaños, amor!</title>
  <style>
    :root { color-scheme: light; --pink:#f06f98; --cream:#fff1d8; --choco:#754455; }
    * { box-sizing:border-box }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden;
      font-family: "Trebuchet MS", system-ui, sans-serif; color:#754455;
      background: radial-gradient(circle at 50% 42%, #fff 0, #fff6f8 38%, #fce5ed 100%);
    }
    .scene { width:min(100%, 720px); padding:30px 18px 42px; text-align:center; position:relative; }
    h1 { margin:0 0 5px; color:#d94f7c; font-family:Georgia,serif; font-size:clamp(2rem,7vw,3.4rem); }
    .subtitle { margin:0 0 4px; font-size:1.05rem; color:#966776; }
    .cake-wrap { width:min(94vw, 520px); margin:0 auto; }
    svg { display:block; width:100%; overflow:visible; }
    .slice { transform-box:fill-box; transform-origin:center; transition:transform .9s cubic-bezier(.2,.8,.25,1); }
    .cake-wrap.open .slice { transform:translate(112px,-45px) rotate(12deg); }
    .flame { transform-origin:50% 100%; animation:flicker .65s ease-in-out infinite alternate; }
    @keyframes flicker { to { transform:scale(.82,1.12) rotate(4deg); opacity:.75 } }
    .btn {
      border:0; border-radius:999px; padding:14px 24px; color:white; background:#e75f8b;
      font:700 1rem inherit; font-weight:700; font-size:1rem; letter-spacing:.02em;
      box-shadow:0 7px 0 #c74873, 0 12px 22px #d8668a38; cursor:pointer;
      transition:transform .15s, box-shadow .15s;
    }
    .btn:hover { transform:translateY(-2px); box-shadow:0 9px 0 #c74873, 0 14px 22px #d8668a38; }
    .btn:active { transform:translateY(4px); box-shadow:0 3px 0 #c74873; }
    .btn:focus-visible { outline:3px solid #754455; outline-offset:5px; }
    .message { min-height:1.6em; margin:22px 0 0; font:italic 1.4rem Georgia,serif; color:#cc4d77; }
    .sparkle { position:absolute; color:#e5a73d; animation:twinkle 1.8s ease-in-out infinite alternate; }
    .s1 { top:34%; left:13%; font-size:25px } .s2 { top:47%; right:11%; font-size:32px; animation-delay:.7s }
    .s3 { top:22%; right:18%; font-size:19px; animation-delay:1.1s }
    @keyframes twinkle { to { transform:scale(.65) rotate(25deg); opacity:.45 } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important; transition-duration:.01ms!important } }
  </style>
</head>
<body>
  <main class="scene">
    <span class="sparkle s1" aria-hidden="true">✦</span><span class="sparkle s2" aria-hidden="true">✧</span><span class="sparkle s3" aria-hidden="true">✦</span>
    <h1>Un dulce para ti</h1>
    <p class="subtitle">Hoy celebramos a la persona más especial 💕</p>
    <div class="cake-wrap" id="cake">
      <svg viewBox="0 0 520 350" role="img" aria-labelledby="cakeTitle cakeDesc">
        <title id="cakeTitle">Torta de cumpleaños</title><desc id="cakeDesc">Una torta rosada con velitas y una porción que se separa al tocar el botón.</desc>
        <ellipse cx="255" cy="305" rx="190" ry="22" fill="#e9b5c3" opacity=".35"/>
        <!-- Plato -->
        <ellipse cx="255" cy="283" rx="180" ry="32" fill="#fff" stroke="#edc5d0" stroke-width="5"/>
        <ellipse cx="255" cy="278" rx="143" ry="23" fill="#fff8f6"/>
        <!-- Torta base -->
        <path d="M110 164h290v92c0 18-65 32-145 32s-145-14-145-32z" fill="#f5a9bd" stroke="#d76d8c" stroke-width="3"/>
        <ellipse cx="255" cy="164" rx="145" ry="39" fill="#ffe7cf" stroke="#d76d8c" stroke-width="3"/>
        <!-- Glaseado y gotitas -->
        <path d="M112 165c15 17 28 2 42 11 15 10 28-1 42 6 16 9 29-3 44 4 16 8 30-4 45 3 16 8 30-5 45 2 16 7 30-3 43-10v17c-14 11-29 2-43 9-16 8-29-2-45 5-15 7-29-3-45 4-15 7-29-3-44 4-15 7-30-4-44 4-16 8-29-1-41-7z" fill="#fff7eb"/>
        <g fill="#fff6ef"><circle cx="151" cy="217" r="5"/><circle cx="211" cy="239" r="5"/><circle cx="283" cy="216" r="5"/><circle cx="346" cy="238" r="5"/></g>
        <!-- Velitas -->
        <g stroke="#fff" stroke-width="2"><path d="M202 128v-34" stroke="#f06f98" stroke-width="12"/><path d="M255 119V79" stroke="#8ac7b5" stroke-width="12"/><path d="M308 128v-34" stroke="#f5b84b" stroke-width="12"/></g>
        <g fill="#ffbd4a"><path class="flame" d="M202 89c-18-18 4-29 5-39 14 15 18 26 5 39z"/><path class="flame" d="M255 74c-18-18 4-29 5-39 14 15 18 26 5 39z"/><path class="flame" d="M308 89c-18-18 4-29 5-39 14 15 18 26 5 39z"/></g>
        <!-- Pedazo triangular animado: cara superior, lateral y base -->
        <g class="slice">
          <path d="M255 164L400 164 327 204z" fill="#fff0d8" stroke="#d76d8c" stroke-width="3" stroke-linejoin="round"/>
          <path d="M327 204L400 164v78c0 7-30 17-73 22z" fill="#ee91aa" stroke="#d76d8c" stroke-width="3" stroke-linejoin="round"/>
          <path d="M327 204c25-13 49-25 73-40v15c-23 16-49 29-73 42z" fill="#fff7eb"/>
          <circle cx="344" cy="218" r="4" fill="#fff6ef"/><circle cx="379" cy="195" r="4" fill="#fff6ef"/>
          <path d="M255 164c24-20 50-29 77-29s52 9 68 29c-20 7-47 16-73 40-20-18-43-31-72-40z" fill="#f5abc0" stroke="#d76d8c" stroke-width="3" stroke-linejoin="round" opacity=".98"/>
          <g fill="#fff4e4"><circle cx="297" cy="154" r="5"/><circle cx="337" cy="148" r="5"/><circle cx="370" cy="157" r="5"/></g>
        </g>
      </svg>
    </div>
    <button class="btn" id="wishButton" type="button" aria-expanded="false">Pide un deseo y corta la torta 🎂</button>
    <p class="message" id="message" aria-live="polite"></p>
  </main>
  <script>
    const cake = document.querySelector('#cake');
    const button = document.querySelector('#wishButton');
    const message = document.querySelector('#message');
    button.addEventListener('click', () => {
      const opened = cake.classList.toggle('open');
      button.setAttribute('aria-expanded', String(opened));
      button.textContent = opened ? '¡Qué rico! Juntamos la torta 💗' : 'Pide un deseo y corta la torta 🎂';
      message.textContent = opened ? '¡Feliz cumpleaños, amor! Te quiero muchísimo 💖' : '';
    });
  </script>
</body>
</html>
